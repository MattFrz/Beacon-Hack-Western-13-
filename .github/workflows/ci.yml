# Runs on every PR and on main: the tests and builds each part already has.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  laptop:
    name: Bridge and dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: laptop/*/package-lock.json
      - name: Bridge tests
        working-directory: laptop/bridge
        run: npm ci && npm test
      - name: Dashboard tests and build
        working-directory: laptop/dashboard
        run: npm ci && npm test && npm run build

  percept:
    name: Percept probe tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The suite is synthetic: it fakes onnxruntime, mediapipe and the camera.
      # numpy and cv2 are the only real imports the tests make. Pin the major
      # versions: opencv-python-headless 5.x cannot bind numpy and breaks cv2 import.
      - name: Install test dependencies
        run: pip install "numpy>=1.26,<3" "opencv-python-headless>=4.10,<5"
      - name: Percept tests
        run: make -C percept test-python PYTHON=python3

  native:
    name: guided, supervisor, telemd, ingest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install libjpeg (telemd preview)
        run: sudo apt-get update && sudo apt-get install -y libjpeg-turbo8-dev
      - name: guided build and law tests
        run: make -C guided all test
      - name: supervisor build and restart test
        run: make -C supervisor test
      - name: telemd build, with and without preview
        run: make -C telemd all preview
      - name: ingest build and end-to-end relay test
        run: make -C ingest test

  graphify:
    name: graphify graph updated
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Code or doc changes must ship a refreshed graphify-out/graph.json (AGENTS.md)
        run: |
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD)
          # shortcut: these extensions mirror what graphify reads in this repo; extend the list if it starts reading new types
          tracked=$(printf '%s\n' "$changed" | grep -vE '^graphify-out/|package-lock\.json$' | grep -E '\.(c|h|cpp|py|js|jsx|json|sh|ps1|yml|md|html|txt)$' || true)
          if [ -n "$tracked" ] && ! printf '%s\n' "$changed" | grep -qx 'graphify-out/graph.json'; then
            echo "::error::This PR changes code or docs but not graphify-out/graph.json. Refresh the graph (see AGENTS.md) and commit graphify-out/."
            printf '%s\n' "$tracked"
            exit 1
          fi
          echo "Graph refreshed, or no code/doc changes."
